name: "Setup Node.js and pnpm"

description: "Sets up Node.js and pnpm with caching and installs dependencies"

inputs:
    node-version:
        description: "Node.js version to use"
        required: false
        default: "20.19.2"
    pnpm-version:
        description: "Optional pnpm version to use; defaults to the repo packageManager field"
        required: false
        default: ""
    skip-install:
        description: "Skip dependency installation"
        required: false
        default: "false"
    install-args:
        description: "Additional arguments for pnpm install"
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        - name: Install pnpm from packageManager
          if: ${{ inputs.pnpm-version == '' }}
          uses: pnpm/action-setup@v4
        - name: Install pnpm from explicit version
          if: ${{ inputs.pnpm-version != '' }}
          uses: pnpm/action-setup@v4
          with:
              version: ${{ inputs.pnpm-version }}
        - name: Get pnpm store directory
          shell: bash
          run: |
              echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        - name: Setup pnpm cache
          uses: actions/cache@v4
          with:
              path: ${{ env.STORE_PATH }}
              key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
              restore-keys: |
                  ${{ runner.os }}-pnpm-store-
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
        - name: Install dependencies
          if: ${{ inputs.skip-install != 'true' }}
          shell: bash
          run: pnpm install ${{ inputs.install-args }}
